<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A calm public home for a musician, featuring selected recordings, performance history, and booking contact information."
    >
    <title>Musician Website</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <nav class="nav" aria-label="Primary navigation">
        <a class="nav__brand" href="#top" aria-label="Home" data-profile="navLabel">Home</a>
        <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-links">
          <span class="nav__toggle-line"></span>
          <span class="nav__toggle-line"></span>
          <span class="sr-only">Menu</span>
        </button>
        <div class="nav__links" id="nav-links">
          <a href="#about">About</a>
          <a href="#music">Music</a>
          <a href="#performances">Performances</a>
          <a href="#contact">Contact</a>
        </div>
      </nav>
    </header>

    <main id="main">
      <section class="hero section" id="top" aria-labelledby="hero-title">
        <div class="hero__image-wrap reveal">
          <img
            class="hero__image"
            alt=""
            data-profile-image="hero"
          >
        </div>

        <div class="hero__content reveal">
          <p class="eyebrow" data-profile="hero.eyebrow"></p>
          <h1 id="hero-title" data-profile="name"></h1>
          <p class="hero__lede" data-profile="hero.lede"></p>
          <div class="hero__actions" aria-label="Primary actions" data-render="hero-actions"></div>
        </div>
      </section>

      <section class="section section--text" id="about" aria-labelledby="about-title">
        <div class="section__intro reveal">
          <p class="eyebrow" data-profile="about.eyebrow"></p>
          <h2 id="about-title" data-profile="about.heading"></h2>
        </div>

        <div class="about-grid">
          <div class="prose reveal" data-render="about-copy"></div>

          <figure class="photo-note reveal">
            <img
              alt=""
              data-profile-image="about"
            >
            <figcaption data-profile="about.imageCaption"></figcaption>
          </figure>
        </div>
      </section>

      <section class="section media-section" id="music" aria-labelledby="music-title">
        <div class="section__intro reveal">
          <p class="eyebrow" data-media="intro.eyebrow"></p>
          <h2 id="music-title" data-media="intro.heading"></h2>
          <p data-media="intro.text"></p>
        </div>

        <div class="media-grid" data-render="media"></div>
      </section>

      <section class="section performances" id="performances" aria-labelledby="performances-title">
        <div class="section__intro reveal">
          <p class="eyebrow" data-performances="intro.eyebrow"></p>
          <h2 id="performances-title" data-performances="intro.heading"></h2>
        </div>

        <div class="performance-layout">
          <div class="event-list reveal" aria-labelledby="upcoming-title">
            <h3 id="upcoming-title">Upcoming</h3>
            <div data-render="upcoming-events"></div>
          </div>

          <div class="recent reveal" aria-labelledby="recent-title">
            <h3 id="recent-title">Recent</h3>
            <ul data-render="recent-performances"></ul>
          </div>
        </div>
      </section>

      <section class="section image-band" aria-label="Performance contexts" data-render="photo-contexts"></section>

      <section class="section contact" id="contact" aria-labelledby="contact-title">
        <div class="contact__content reveal">
          <p class="eyebrow" data-contact="eyebrow"></p>
          <h2 id="contact-title" data-contact="heading"></h2>
          <p data-contact="text"></p>
          <a class="contact-link" href="#" data-render="contact-link"></a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p data-profile="footer"></p>
    </footer>

    <script src="content/profile.js"></script>
    <script src="content/media.js"></script>
    <script src="content/performances.js"></script>
    <script src="content/photos.js"></script>
    <script src="content/contact.js"></script>
    <script src="script.js"></script>
  </body>
</html>
